<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solmar Bay — Open-World Crime Game</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1520;
    font-family: Arial, Helvetica, sans-serif; color: #f1faee; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  #hud.hidden { display: none; }
  .hud-panel { position: absolute; background: rgba(10, 18, 28, 0.72); border: 1px solid rgba(255,255,255,0.18);
    border-radius: 10px; padding: 10px 14px; backdrop-filter: blur(2px); }
  #hud-topleft { top: 14px; left: 14px; min-width: 190px; }
  #health-bar { height: 12px; background: #222; border-radius: 6px; overflow: hidden; margin-bottom: 6px; }
  #health-fill { height: 100%; width: 100%; background: #37b24d; transition: width 0.2s; }
  #health-text { font-size: 15px; font-weight: bold; }
  #money-text { font-size: 22px; font-weight: bold; color: #37e08a; margin-top: 4px; }
  #district-text { font-size: 13px; color: #9fb3c8; margin-top: 2px; letter-spacing: 1px; text-transform: uppercase; }
  #hud-topright { top: 14px; right: 14px; text-align: right; }
  #stars-text { font-size: 26px; letter-spacing: 4px; line-height: 1; }
  #wanted-label { font-size: 12px; letter-spacing: 2px; margin-top: 4px; font-weight: bold; }
  #mission-box { left: 50%; transform: translateX(-50%); top: 14px; max-width: 520px; text-align: center; }
  #mission-title { font-size: 15px; font-weight: bold; color: #ffd23f; letter-spacing: 1px; }
  #mission-text { font-size: 14px; margin-top: 3px; line-height: 1.35; }
  #speed-box { right: 14px; bottom: 14px; display: none; }
  #speed-text { font-size: 28px; font-weight: bold; }
  #hint-box { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
    font-size: 14px; color: #e8e8e8; text-shadow: 0 1px 3px #000; text-align: center; }
  #toast-box { position: absolute; top: 96px; left: 50%; transform: translateX(-50%);
    background: rgba(255, 210, 63, 0.95); color: #14213d; font-weight: bold; font-size: 15px;
    padding: 8px 18px; border-radius: 20px; opacity: 0; transition: opacity 0.3s; white-space: nowrap; }
  #toast-box.show { opacity: 1; }
  #map-wrap { left: 14px; bottom: 14px; padding: 6px; }
  #minimap { display: block; width: 190px; height: 190px; border-radius: 6px; }
  .overlay { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    background: linear-gradient(160deg, rgba(8, 20, 38, 0.88), rgba(120, 40, 10, 0.72)); padding: 20px; }
  .overlay.hidden { display: none; }
  .overlay h1 { font-size: 64px; margin: 0; letter-spacing: 6px; color: #ffd23f;
    text-shadow: 0 4px 0 #b3541e, 0 8px 24px rgba(0,0,0,0.6); }
  .overlay h2 { font-size: 44px; margin: 0 0 10px; letter-spacing: 4px; color: #ffd23f; }
  .overlay p { max-width: 640px; line-height: 1.5; font-size: 16px; }
  .tagline { font-size: 19px !important; color: #ffe9a8; font-style: italic; }
  .controls-grid { display: grid; grid-template-columns: auto auto; gap: 6px 18px;
    text-align: left; margin: 18px 0; font-size: 15px; }
  .controls-grid span:nth-child(odd) { font-weight: bold; color: #ffd23f; }
  .overlay button { pointer-events: auto; cursor: pointer; margin-top: 12px;
    background: #ffd23f; color: #14213d; border: none; border-radius: 8px;
    padding: 14px 34px; font-size: 18px; font-weight: bold; letter-spacing: 1px; }
  .overlay button:hover { background: #ffe066; }
  .overlay button.hidden { display: none; }
  .foot { font-size: 13px !important; color: #9fb3c8; margin-top: 20px; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Solmar Bay: a 3D open-world crime game. Walk and drive around the city, steal cars, finish missions and outrun the police."></canvas>
<div id="hud" class="hidden"></div>
<p id="status" role="status" aria-live="polite"></p>
<script src="./vendor/three.min.js"></script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
